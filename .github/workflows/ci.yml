name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # Torch CPU-only : evite le telechargement des librairies CUDA du
      # wheel par defaut, inutiles sans GPU et nettement plus volumineux
      # (meme optimisation que backend/Dockerfile). torchaudio et
      # torchcodec doivent venir du meme index que torch, sinon pip
      # resout des wheels incompatibles (ABI pour torchaudio, CUDA pour
      # torchcodec) avec le build torch installe ici.
      - name: Install CPU-only torch
        run: pip install torch torchaudio torchcodec --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy .

      - name: Pytest
        run: python -m pytest
