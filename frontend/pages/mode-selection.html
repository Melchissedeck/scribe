<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scribe - Nouvelle session</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/flow.css">
</head>
<body>
  <div class="flow-page">
    <div class="flow-card card">
      <h1 class="flow-title">Nouvelle session</h1>
      <p class="flow-text">Choisissez comment vous souhaitez capter cette réunion.</p>

      <div class="mode-choice">
        <button class="mode-option" id="visio-option">
          <p class="mode-option-title">Réunion à distance</p>
          <p class="mode-option-description">Scribe rejoint votre visioconférence et capte les échanges.</p>
        </button>

        <button class="mode-option" id="dicta-option">
          <p class="mode-option-title">Réunion en présentiel</p>
          <p class="mode-option-description">Scribe utilise le micro de votre appareil comme dictaphone.</p>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/mode-selection.js"></script>
</body>
</html>
