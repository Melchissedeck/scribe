<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var t=localStorage.getItem('scribe-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <title>Scribe - Creer un compte</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/dark.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card card">
      <h1 class="auth-title">Creer un compte</h1>
      <p class="auth-subtitle">Rejoignez Scribe pour ne plus perdre le fil de vos reunions.</p>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Nom</label>
          <input class="input-field" type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="input-field" type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mot de passe</label>
          <div class="password-field">
            <input class="input-field" type="password" id="password" name="password" required minlength="8">
            <button type="button" class="password-toggle" data-target="password" aria-label="Afficher le mot de passe">
              <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 11 7 11 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 1 12s4 7 11 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
            </button>
          </div>
        </div>

        <p class="error-message" id="error-message"></p>

        <button class="button-primary auth-submit" type="submit" id="submit-button">
          Creer mon compte
        </button>
      </form>

      <p class="auth-footer">
        Deja un compte ? <a href="login.html">Se connecter</a>
      </p>
    </div>
  </div>

  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/register.js"></script>
</body>
</html>
